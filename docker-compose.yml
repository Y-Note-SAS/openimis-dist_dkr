version: "2.4"
x-api-prod: &default-api-prod
  build:
    context: ../openimis-be_py/
    args:
      OPENIMIS_CONF_JSON: ${OPENIMIS_BE_CONF_JSON}
  image: openimis/backend:${PROJECT_NAME:-local}
  volumes:
    - ../openimis-be_py:/openimis-be
    - ../openimis-be-core_py:/openimis-be-core_py
    - ../openimis-be-cs_py:/openimis-be-cs_py
    - ../openimis-be-csu_py:/openimis-be-csu_py
    - ../openimis-be-report-cs_py:/openimis-be-report-cs_py
    - ../openimis-be-report-csu_py:/openimis-be-report-csu_py
    - ../openimis-be-program_py:/openimis-be-program_py
    - ../openimis-be-claim_py:/openimis-be-claim_py
    - ../openimis-be-location_py:/openimis-be-location_py
    - ../openimis-be-product_py:/openimis-be-product_py
    - ../openimis-be-policy_py:/openimis-be-policy_py
    - ../openimis-be-insuree_py:/openimis-be-insuree_py
    - ../openimis-be-medical_py:/openimis-be-medical_py
    - ../openimis-be-api_fhir_r4_py:/openimis-be-api_fhir_r4_py
    - ../openimis-be-tools_py:/openimis-be-tools_py
    - photos:/openimis-be/openIMIS/openIMISphone/
  environment: &backend-env-prod
    - DB_HOST=${DB_HOST}
    - DB_PORT=${DB_PORT}
    - DB_NAME=${DB_NAME}
    - DB_USER=${DB_USER}
    - DB_PASSWORD=${DB_PASSWORD}
    - SITE_ROOT=api
    - SITE_URL=${NEW_OPENIMIS_HOST}
    - CELERY_BROKER_URL=amqp://rabbitmq

services:
  backend-prod:
    <<: *default-api-prod
    container_name: ${PROJECT_NAME:-csu}-backend-prod
    command: start
    networks:
      openimis-net:
         ipv4_address: 172.20.${IP_SUB:-20}.10
    ports:
      - ${HTTP_PORT:-8002}:8000
    restart: always
  worker-prod:
    <<: *default-api-prod
    container_name: ${PROJECT_NAME:-csu}-worker-prod
    command: worker
    networks:
      openimis-net:
        ipv4_address: 172.20.${IP_SUB:-20}.11
    restart: always
  rabbitmq:
    container_name: ${PROJECT_NAME:-csu}-prod-rabbitmq
    image: rabbitmq:3-management
    # restart: always
    networks:
      openimis-net:
        ipv4_address: 172.20.${IP_SUB:-20}.13
    restart: always
networks:
  openimis-net:
    name: ${PROJECT_NAME}-openimis-net
    ipam:
      config:
        - subnet: 172.20.${IP_SUB:-20}.0/24
          ip_range: 172.20.${IP_SUB:-20}.0/24
volumes:
  photos:
  logs:
  database: 