services:
  redis-test:
    container_name: ${PROJECT_NAME:-openimis}-redis
    image: redis:latest
    restart: always
    ports:
      - "6380:6379"
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-database-test-csu:/data
      - ./conf/redis/redis.conf:/usr/local/etc/redis/redis.conf
    env_file:
      - ".env.redis"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=6379
      - REDIS_DATABASES=1
    networks:
      openimis-net-test:
volumes:
  redis-database-test-csu: